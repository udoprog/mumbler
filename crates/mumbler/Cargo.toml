[package]
name = "mumbler"
edition = "2024"
publish = false
default-run = "mumbler"

[features]
default = ["tls", "webbrowser", "bundle"]
bundle = []
tls = ["dep:tokio-rustls", "dep:rustls", "tokio/fs", "dep:webpki-roots"]

[dependencies]
api = { path = "../api", features = ["sqll"] }
mumblelink = { path = "../mumblelink"}
sorting = { path = "../sorting" }

rust-embed = "8.13.0"
sqll = { workspace = true, features = ["std", "derive", "threadsafe", "bundled"] }
tokio = { version = "1.54.0", features = ["full"] }
mime_guess = { version = "2.0.5", default-features = false }
axum = { version = "0.8.9", features = ["http1", "json", "query", "tracing", "http2", "ws"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories-next = "2.0.0"
clap = { version = "4.6.7", features = ["derive"] }
tokio-stream = "0.1.19"
musli-web = { workspace = true, features = ["axum08"] }
musli = { version = "0.2.0", features = ["storage", "descriptive"] }
rand = "0.10.3"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
image = "0.25.10"
base64 = { version = "0.23.1", default-features = false }
webbrowser = { version = "1.2.4", optional = true }

musli-core = { version = "0.2.0", default-features = false }
parking_lot = "0.13.0"
bstr = { version = "1.13.1", default-features = false }
async-fuse = "1.0.1"
auth = { package = "watchword", version = "0.3.0", features = ["axum08", "musliweb05", "sqll015"] }
jiff = "0.2.37"
tokio-rustls = { version = "0.26.6", optional = true }
rustls = { version = "0.23.46", optional = true }
webpki-roots = { version = "1.0.10", optional = true }

[dev-dependencies]
auth = { package = "watchword", version = "0.3.0", features = ["test-util"] }

[[bin]]
name = "mumbler-client"

[[bin]]
name = "mumbler-server"
