[package]
name = "web"
edition = "2024"
publish = false

[dependencies]

api = { path = "../api", features = ["yew"] }
sorting = { path = "../sorting" }

anyhow = "1.0.104"
auth = { package = "watchword", version = "0.3.0", features = ["musliweb05", "yew023"] }
phrasebook = { version = "0.2.0", features = ["browser", "yew023"] }
gloo = "0.12.0"
tracing = "0.1.44"
musli-web = { workspace = true, features = ["web03", "yew023"] }
wasm-bindgen = "0.2.129"
tracing-wasm = "0.2.1"
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
url = "2.5.8"
slab = "0.4.12"

[dependencies.web-sys]
version = "0.3.106"
features = [
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "MouseEvent",
    "WheelEvent",
    "Event",
    "File",
    "FileList",
    "HtmlInputElement",
    "ResizeObserver",
    "ResizeObserverEntry",
    "HtmlImageElement",
    "DragEvent",
    "DataTransfer",
    "DomRect",
    "HtmlSelectElement",
]

[dev-dependencies]
sweep = { path = "../sweep" }
